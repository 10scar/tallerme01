name: Compilar Entregable

on:
  push:
    branches: [main]
    paths:
      - "Entregable.tex"
      - "Materiales/**"
      - ".github/workflows/build-entregable.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generar PDF
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar Entregable.tex con LuaLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Entregable.tex
          latex_engine: lualatex
          args: -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Renombrar PDF
        run: mv Entregable.pdf "Entregable-${{ github.sha }}.pdf"

      - name: Subir PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Entregable-${{ github.run_number }}
          path: Entregable-${{ github.sha }}.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Publicar PDF como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: entregable-${{ github.run_number }}
          name: "Entregable #${{ github.run_number }}"
          body: |
            PDF generado automáticamente desde el commit ${{ github.sha }}.

            **Autor del push:** ${{ github.actor }}
            **Rama:** ${{ github.ref_name }}
          files: Entregable-${{ github.sha }}.pdf
          make_latest: true
          fail_on_unmatched_files: true
